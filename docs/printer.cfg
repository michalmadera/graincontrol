# =====================================================================
#  Kostka mati - konfiguracja Klippera
#  Plytka: BigTreeTech SKR Mini E3 V3.0 (STM32G0B1), host: Raspberry Pi 5
#  Stan: 2026-11-04 - wygenerowana OFFLINE, NIETESTOWANA NA SPRZECIE
#
#  Osie (obie jako manual_stepper, kinematics: none):
#    stol     (gniazdo Z)  zmienna T = wysokosc plyty nad podlozem [mm]
#    spychacz (gniazdo X)  zmienna s = przesuniecie od parkingu, + do przodu
#
#  REGULY KOLIZYJNE (interlock, sprawdzane przed KAZDYM ruchem):
#    - T > 530  =>  s <= 405
#    - s > 405  =>  T <= 530
#    - zakresy: T w [177, 572], s w [-2, 450]
#    - bazowanie spychacza (jazda na ogranicznik s ~ 450.3) tylko przy T <= 530
#
#  Makra dla uzytkownika / aplikacji (Moonraker):
#    KALIBRUJ, PRZYGOTUJ, POMIAR, GORA_5MM, DOL_5MM, GORA_1MM, DOL_1MM,
#    STAN_SYSTEMU (raport), ODBLOKUJ (reset blokady po bledzie)
#  Bezposrednie komendy MANUAL_STEPPER omijaja interlock - nie uzywac
#  z aplikacji.
#
#  DO WERYFIKACJI PRZY URUCHOMIENIU - lista w docs/architecture_baseline.md, sekcja 7
# =====================================================================

[mcu]
serial: /dev/serial/by-id/DO_UZUPELNIENIA_PO_PODLACZENIU

[printer]
kinematics: none
max_velocity: 200
max_accel: 1000

# Sekcje wymagane przez Moonraker
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

# Komunikaty RESPOND do konsoli / aplikacji
[respond]

# ---------------------------------------------------------------------
#  SPYCHACZ (gniazdo X)
#  JK42HS40-0504 (0.5 A/faza), GT2 20T -> rotation_distance 40 (80 krokow/mm)
#  Twardy ogranicznik przedni: korpusy napinaczy pasow, s = 450.3
# ---------------------------------------------------------------------
[manual_stepper spychacz]
step_pin: PB13
dir_pin: !PB12                  # kierunek do sprawdzenia: +s = do przodu
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
velocity: 60
accel: 500
position_min: -2
position_max: 450
# bazowanie bezczujnikowe w strone +s (DIAG X -> PC0, wymaga zworki DIAG)
endstop_pin: tmc2209_spychacz:virtual_endstop

[tmc2209 manual_stepper spychacz]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.35
stealthchop_threshold: 999999   # StallGuard TMC2209 dziala tylko w stealthChop
diag_pin: ^PC0
driver_SGTHRS: 80               # DO KALIBRACJI (wieksza wartosc = czulszy)

# ---------------------------------------------------------------------
#  STOL (gniazdo Z)
#  JK42HS40-0504 (0.5 A/faza), sruby T8x2 -> rotation_distance 2 (1600 krokow/mm)
#  Twardy ogranicznik dolny: T ~ 173.5
#  position_min = 150 TYLKO po to, by bazowanie zmiescilo sie w jednym ruchu
#  (572 -> 150 = 422 mm >= maks. droga mechaniczna 589 - 173.5 = 415.5 mm).
#  Zakres roboczy [177, 572] pilnuja makra (_RUCH_STOL).
# ---------------------------------------------------------------------
[manual_stepper stol]
step_pin: PB0
dir_pin: PC5                    # kierunek do sprawdzenia: +T = w gore
enable_pin: !PB1
microsteps: 16
rotation_distance: 2
velocity: 10                    # 300 obr/min silnika - sprawdzic moment
accel: 50
position_min: 150
position_max: 572               # TWARDY LIMIT - szczelina zerowa pod zgarniaczem
endstop_pin: tmc2209_stol:virtual_endstop

[tmc2209 manual_stepper stol]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.35
stealthchop_threshold: 999999
diag_pin: ^PC2
driver_SGTHRS: 60               # DO KALIBRACJI (sruby T8x2 silnie tlumia StallGuard)

# Sruba T8x2 jest samohamowna, ale po wylaczeniu napedow pozycje sa niepewne:
# po bezczynnosci wylaczamy silniki i kasujemy flage kalibracji.
[idle_timeout]
timeout: 3600
gcode:
    MANUAL_STEPPER STEPPER=spychacz ENABLE=0
    MANUAL_STEPPER STEPPER=stol ENABLE=0
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=skalibrowany VALUE=0
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=przygotowany VALUE=0
    RESPOND TYPE=echo MSG="Bezczynnosc: silniki wylaczone, wymagane KALIBRUJ"

# =====================================================================
#  PARAMETRY
# =====================================================================
[gcode_macro _KONFIG]
# zakresy robocze
variable_t_min: 177.0
variable_t_max: 572.0
variable_s_min: -2.0
variable_s_max: 450.0
# interlock
variable_t_kolizja: 530.0           # powyzej: spychacz tylko s <= s_kolizja
variable_s_kolizja: 405.0           # powyzej: stol tylko T <= t_kolizja
variable_tolerancja: 0.01
# pozycje cyklu
variable_s_parking: 0.0
variable_s_koniec_rozgarniania: 405.0
variable_t_szczelina_zero: 572.0
# Szczelina pod zgarniaczem g = 572 - T. Ta sama wysokosc sluzy do ZALADUNKU
# (najkrotszy zsyp: wylot rozprowadzacza z = 645 -> 645 - 571.5 = 73.5 mm)
# i do ROZGARNIANIA (stol nie rusza sie miedzy wsypaniem a rozgarnianiem).
variable_szczelina_domyslna: 0.5    # T = 572 - 0.5 = 571.5 (JEDEN rozmiar ziaren - stan obecny)
variable_szczelina_min: 0.5
# --- NA PRZYSZLOSC (nieaktywne): szczelina zalezna od wielkosci ziarna ---
#   g = wsp_szczeliny * rozmiar_ziarna,  wsp_szczeliny = 1.0 ... 1.5
#   Po wlaczeniu: odkomentowac ponizsze zmienne i linie oznaczona
#   "NA PRZYSZLOSC" w makrze PRZYGOTUJ.
# variable_rozmiar_ziarna: 5.0      # d [mm] - frakcja badanej probki
# variable_wsp_szczeliny: 1.2       # 1.0 ... 1.5, do strojenia
# Odjazd stolu w dol przed powrotem spychacza (ochrona warstwy).
# 10 mm dobrane dla OBECNEGO, jednego rozmiaru ziaren.
# ZMIENIC przy innym rozmiarze ziaren (odjazd musi byc wiekszy od ziarna;
# dla ziaren do 30 mm ok. 40 mm).
variable_t_odjazd_przed_powrotem: 10.0
variable_t_zdjecia: 177.0           # DO WERYFIKACJI I DOSTROJENIA PO TESTACH
# predkosci [mm/s]
variable_v_stol: 10.0
variable_v_stol_reczny: 5.0
variable_v_spychacz: 60.0
variable_v_rozgarnianie: 45.0
# bazowanie
variable_t_bazowanie_start: 572.0
variable_t_bazowanie_cel: 150.0
variable_t_ogranicznik: 173.5
variable_v_bazowanie_stol: 5.0
variable_s_bazowanie_start: -2.0    # -2 zamiast 0: droga 452 mm > 450.3 mm z parkingu
variable_s_bazowanie_cel: 450.0
variable_s_ogranicznik: 450.0
variable_v_bazowanie_spychacz: 20.0
gcode:

# =====================================================================
#  STAN SYSTEMU - blokada zajetosci i flaga kalibracji
# =====================================================================
[gcode_macro STAN_SYSTEMU]
description: Raport stanu (zajetosc, kalibracja, gotowosc do zaladunku, pozycje T i s)
variable_zajety: 0
variable_skalibrowany: 0
variable_przygotowany: 0            # 1 = po PRZYGOTUJ, stol na wysokosci zaladunku
variable_t_zaladunku: 0.0           # T ustawione przez PRZYGOTUJ (= wysokosc rozgarniania)
gcode:
    {% set t = printer["manual_stepper stol"].position|float %}
    {% set s = printer["manual_stepper spychacz"].position|float %}
    RESPOND TYPE=echo MSG="STAN: zajety={zajety} skalibrowany={skalibrowany} przygotowany={przygotowany} T={'%.2f' % t} s={'%.2f' % s}"

[gcode_macro ODBLOKUJ]
description: Reset blokady po bledzie. Kasuje kalibracje - potem wymagane KALIBRUJ.
gcode:
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=zajety VALUE=0
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=skalibrowany VALUE=0
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=przygotowany VALUE=0
    RESPOND TYPE=echo MSG="Blokada zdjeta. Wykonaj KALIBRUJ."

# Sprawdza flage zajetosci (i opcjonalnie kalibracje), potem blokuje.
# Wywolywane jako PIERWSZA komenda kazdego makra uzytkownika;
# blad przerywa cale makro nadrzedne, zanim ruszy jakakolwiek os.
[gcode_macro _ZAJMIJ]
gcode:
    {% set st = printer["gcode_macro STAN_SYSTEMU"] %}
    {% set nazwa = params.MAKRO|default("?") %}
    {% if st.zajety|int != 0 %}
        { action_raise_error("%s: system zajety (zajety=1). Jesli poprzednie makro przerwal blad - ODBLOKUJ." % nazwa) }
    {% endif %}
    {% if params.KALIBRACJA|default(1)|int == 1 and st.skalibrowany|int == 0 %}
        { action_raise_error("%s: osie nieskalibrowane - wykonaj KALIBRUJ." % nazwa) }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=zajety VALUE=1

[gcode_macro _ZWOLNIJ]
gcode:
    M400
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=zajety VALUE=0

# =====================================================================
#  RUCHY Z INTERLOCKIEM
#  Pozycje odczytywane w chwili wykonania makra (po zakonczeniu
#  poprzednich ruchow), wiec kazdy ruch jest sprawdzany osobno.
# =====================================================================
[gcode_macro _RUCH_STOL]
gcode:
    {% set k = printer["gcode_macro _KONFIG"] %}
    {% set t = params.T|float %}
    {% set v = params.SPEED|default(k.v_stol)|float %}
    {% set s = printer["manual_stepper spychacz"].position|float %}
    {% if t < k.t_min - k.tolerancja or t > k.t_max + k.tolerancja %}
        { action_raise_error("STOL: T=%.2f poza zakresem [%.1f, %.1f]" % (t, k.t_min, k.t_max)) }
    {% endif %}
    {% if t > k.t_kolizja + k.tolerancja and s > k.s_kolizja + k.tolerancja %}
        { action_raise_error("INTERLOCK: stol na T=%.2f > %.0f niedozwolony przy s=%.2f > %.0f" % (t, k.t_kolizja, s, k.s_kolizja)) }
    {% endif %}
    MANUAL_STEPPER STEPPER=stol SPEED={v} MOVE={t}

[gcode_macro _RUCH_SPYCHACZ]
gcode:
    {% set k = printer["gcode_macro _KONFIG"] %}
    {% set s = params.S|float %}
    {% set v = params.SPEED|default(k.v_spychacz)|float %}
    {% set t = printer["manual_stepper stol"].position|float %}
    {% if s < k.s_min - k.tolerancja or s > k.s_max + k.tolerancja %}
        { action_raise_error("SPYCHACZ: s=%.2f poza zakresem [%.1f, %.1f]" % (s, k.s_min, k.s_max)) }
    {% endif %}
    {% if s > k.s_kolizja + k.tolerancja and t > k.t_kolizja + k.tolerancja %}
        { action_raise_error("INTERLOCK: spychacz na s=%.2f > %.0f niedozwolony przy T=%.2f > %.0f" % (s, k.s_kolizja, t, k.t_kolizja)) }
    {% endif %}
    MANUAL_STEPPER STEPPER=spychacz SPEED={v} MOVE={s}

# =====================================================================
#  KALIBRUJ - bazowanie bezczujnikowe (StallGuard)
#  Kolejnosc obowiazkowa: najpierw stol w dol, potem spychacz.
# =====================================================================
[gcode_macro KALIBRUJ]
description: Bazowanie: stol w dol do oporu (T=173.5 -> 177), spychacz do przodu do oporu (s=450 -> 0)
gcode:
    _ZAJMIJ MAKRO=KALIBRUJ KALIBRACJA=0
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=skalibrowany VALUE=0
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=przygotowany VALUE=0
    _KALIBRUJ_STOL
    _KALIBRUJ_SPYCHACZ
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=skalibrowany VALUE=1
    _ZWOLNIJ
    RESPOND TYPE=echo MSG="KALIBRUJ: zakonczone (T=177, s=0)"

[gcode_macro _KALIBRUJ_STOL]
gcode:
    {% set k = printer["gcode_macro _KONFIG"] %}
    # Ruch w dol jest zawsze bezpieczny - spychacz moze stac gdziekolwiek.
    MANUAL_STEPPER STEPPER=stol ENABLE=1
    MANUAL_STEPPER STEPPER=stol SET_POSITION={k.t_bazowanie_start}
    MANUAL_STEPPER STEPPER=stol SPEED={k.v_bazowanie_stol} MOVE={k.t_bazowanie_cel} STOP_ON_ENDSTOP=1
    MANUAL_STEPPER STEPPER=stol SET_POSITION={k.t_ogranicznik}
    MANUAL_STEPPER STEPPER=stol SPEED={k.v_bazowanie_stol} MOVE={k.t_min}

[gcode_macro _KALIBRUJ_SPYCHACZ]
gcode:
    {% set k = printer["gcode_macro _KONFIG"] %}
    {% set t = printer["manual_stepper stol"].position|float %}
    {% if t > k.t_kolizja %}
        { action_raise_error("KALIBRUJ: bazowanie spychacza wymaga T <= %.0f (T=%.2f)" % (k.t_kolizja, t)) }
    {% endif %}
    MANUAL_STEPPER STEPPER=spychacz ENABLE=1
    MANUAL_STEPPER STEPPER=spychacz SET_POSITION={k.s_bazowanie_start}
    MANUAL_STEPPER STEPPER=spychacz SPEED={k.v_bazowanie_spychacz} MOVE={k.s_bazowanie_cel} STOP_ON_ENDSTOP=1
    MANUAL_STEPPER STEPPER=spychacz SET_POSITION={k.s_ogranicznik}
    MANUAL_STEPPER STEPPER=spychacz SPEED={k.v_spychacz} MOVE={k.s_parking}

# =====================================================================
#  RECZNE RUCHY STOLU (z interlockiem)
# =====================================================================
# Krok jest walidowany (zakres + interlock) PRZED zajeciem blokady:
# odrzucony krok nie blokuje systemu. _RUCH_STOL sprawdza ponownie.
# Kazdy reczny ruch stolu kasuje gotowosc z PRZYGOTUJ (wysokosc zaladunku
# przestaje byc pewna) - przed POMIAR trzeba ponownie wykonac PRZYGOTUJ.
[gcode_macro _STOL_KROK]
gcode:
    {% set k = printer["gcode_macro _KONFIG"] %}
    {% set nazwa = params.MAKRO|default("?") %}
    {% set t = printer["manual_stepper stol"].position|float + params.DT|float %}
    {% set s = printer["manual_stepper spychacz"].position|float %}
    {% if t < k.t_min - k.tolerancja or t > k.t_max + k.tolerancja %}
        { action_raise_error("%s: odrzucono - T=%.2f poza zakresem [%.1f, %.1f]" % (nazwa, t, k.t_min, k.t_max)) }
    {% endif %}
    {% if t > k.t_kolizja + k.tolerancja and s > k.s_kolizja + k.tolerancja %}
        { action_raise_error("%s: odrzucono - INTERLOCK: T=%.2f > %.0f przy s=%.2f > %.0f" % (nazwa, t, k.t_kolizja, s, k.s_kolizja)) }
    {% endif %}
    _ZAJMIJ MAKRO={nazwa}
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=przygotowany VALUE=0
    _RUCH_STOL T={t} SPEED={k.v_stol_reczny}
    _ZWOLNIJ

[gcode_macro GORA_5MM]
description: Stol w gore o 5 mm (interlock)
gcode:
    _STOL_KROK MAKRO=GORA_5MM DT=5

[gcode_macro DOL_5MM]
description: Stol w dol o 5 mm (interlock)
gcode:
    _STOL_KROK MAKRO=DOL_5MM DT=-5

[gcode_macro GORA_1MM]
description: Stol w gore o 1 mm (interlock)
gcode:
    _STOL_KROK MAKRO=GORA_1MM DT=1

[gcode_macro DOL_1MM]
description: Stol w dol o 1 mm (interlock)
gcode:
    _STOL_KROK MAKRO=DOL_1MM DT=-1

# =====================================================================
#  PRZYGOTUJ - pozycja zaladunku (przed wsypaniem probki)
#  Spychacz s = 0 (czolo zgarniacza y = 72.7, za pasem zsypu y = 120..156),
#  stol na NAJWYZSZEJ dozwolonej wysokosci = wysokosc rozgarniania
#  T = 572 - szczelina = 571.5 -> spadek z wylotu rozprowadzacza (z = 645)
#  tylko 73.5 mm (przy T = 177 bylby 468 mm). Wyzej nie wolno: T = 572 to
#  szczelina zerowa, a g >= 0.5. Gora scianek T + 40 = 611.5 < 617 (belka
#  spychacza) < 645 (rozprowadzacz) - brak kolizji.
#  Parametr opcjonalny: SZCZELINA=<mm> (domyslnie 0.5)
#  Kolejnosc w aplikacji: PRZYGOTUJ -> wsypanie + odczekanie na splyw
#  (potwierdzenie na ekranie) -> POMIAR
# =====================================================================
[gcode_macro PRZYGOTUJ]
description: Pozycja zaladunku: spychacz s=0, stol T=571.5 (najkrotszy zsyp z rozprowadzacza)
gcode:
    {% set k = printer["gcode_macro _KONFIG"] %}
    {% set g = params.SZCZELINA|default(k.szczelina_domyslna)|float %}
    # NA PRZYSZLOSC - szczelina zalezna od wielkosci ziarna (wymaga odkomentowania
    # zmiennych rozmiar_ziarna i wsp_szczeliny w _KONFIG); zastapic linie powyzej:
    # {% set g = params.SZCZELINA|default(k.wsp_szczeliny * k.rozmiar_ziarna)|float %}
    # (linie z '#' usuwa parser konfiguracji Klippera, wiec Jinja ich nie wykonuje)
    {% if g < k.szczelina_min %}
        { action_raise_error("PRZYGOTUJ: SZCZELINA=%.2f < %.2f" % (g, k.szczelina_min)) }
    {% endif %}
    {% set t = k.t_szczelina_zero - g %}
    {% if t < k.t_min + k.t_odjazd_przed_powrotem %}
        { action_raise_error("PRZYGOTUJ: SZCZELINA=%.2f za duza (T=%.2f)" % (g, t)) }
    {% endif %}
    _ZAJMIJ MAKRO=PRZYGOTUJ
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=przygotowany VALUE=0
    # najpierw spychacz na parking (s = 0 dozwolone przy kazdym T), potem stol w gore
    _RUCH_SPYCHACZ S={k.s_parking}
    _RUCH_STOL T={t}
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=t_zaladunku VALUE={t}
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=przygotowany VALUE=1
    _ZWOLNIJ
    RESPOND TYPE=echo MSG="PRZYGOTUJ: T={'%.2f' % t}, spadek z rozprowadzacza {'%.1f' % (645 - t)} mm. Wsyp probke, odczekaj na splyw, potem POMIAR."

# =====================================================================
#  POMIAR - rozgarnianie -> powrot -> zdjecia
#  Wymaga wczesniejszego PRZYGOTUJ (i wsypania probki). Rozgarnianie odbywa
#  sie na wysokosci zaladunku - stol nie rusza sie miedzy wsypaniem
#  a rozgarnianiem.
#  Parametr opcjonalny: SPEED=<mm/s> rozgarniania
# =====================================================================
[gcode_macro POMIAR]
description: Rozgarnianie (s=0 -> 405 na T z PRZYGOTUJ), powrot (T-10, s=0), zdjecia (T=177)
gcode:
    {% set k = printer["gcode_macro _KONFIG"] %}
    {% set st = printer["gcode_macro STAN_SYSTEMU"] %}
    {% set v = params.SPEED|default(k.v_rozgarnianie)|float %}
    {% if st.przygotowany|int != 1 %}
        { action_raise_error("POMIAR: najpierw PRZYGOTUJ (stol na wysokosci zaladunku), potem wsyp probke.") }
    {% endif %}
    {% set t_rozg = st.t_zaladunku|float %}
    {% set t_powrot = t_rozg - k.t_odjazd_przed_powrotem %}
    _ZAJMIJ MAKRO=POMIAR
    SET_GCODE_VARIABLE MACRO=STAN_SYSTEMU VARIABLE=przygotowany VALUE=0
    # 1. Kontrola pozycji startowej (po PRZYGOTUJ bez ruchu): s = 0, T = t_zaladunku
    _RUCH_SPYCHACZ S={k.s_parking}
    _RUCH_STOL T={t_rozg}
    # 2. Rozgarnianie: spychacz 0 -> 405 ze stala predkoscia
    _RUCH_SPYCHACZ S={k.s_koniec_rozgarniania} SPEED={v}
    # 3. Powrot: stol w dol o t_odjazd_przed_powrotem (10 mm - JEDEN rozmiar ziaren,
    #    ZMIENIC przy innym rozmiarze ziaren), potem spychacz na parking
    _RUCH_STOL T={t_powrot}
    _RUCH_SPYCHACZ S={k.s_parking}
    # 4. Zdjecia:
    # !!! Zmienna T do wykonania zdjec - DO WERYFIKACJI I DOSTROJENIA PO TESTACH !!!
    # !!! (t_zdjecia = 177 -> odleglosc kamera-plyta ok. 563 mm; ostrosc reczna) !!!
    _RUCH_STOL T={k.t_zdjecia}
    _ZWOLNIJ
    RESPOND TYPE=echo MSG="POMIAR: stol w pozycji do zdjec (T={k.t_zdjecia}). LED wlaczyc recznie."
